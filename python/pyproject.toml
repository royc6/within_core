[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "within-core"
version = "1.0.0"
description = "Convert Gemma 4 E4B into chunked Core AI assets for the Apple Neural Engine"
readme = "README.md"
license = "Apache-2.0"
# The pinned stack below was resolved and tested on CPython 3.12 (macOS, Apple silicon).
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.9.0",
    "transformers==5.12.1",
    "safetensors==0.7.0",
    "numpy==2.3.5",
    # Apple's Core AI authoring stack, from PyPI. `coreai-core` (binary wheels) provides
    # the `coreai` import package.
    "coreai-core==1.0.0b2",
    "coreai-torch==0.4.2",
    "coreai-opt==0.2.1",
    # Apple's model building blocks (GELU form, custom lowerings), pinned to a commit.
    "coreai-models @ git+https://github.com/apple/coreai-models@df8119879f125ad1e2e4c6249c2cddded75c190a#subdirectory=python",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.9"]

[project.scripts]
within-convert = "within_core.convert:main"
within-verify = "within_core.verify.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
within_core = ["reference-config.json", "legal/LICENSE", "legal/NOTICE"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["within_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-p", "no:cacheprovider", "--strict-markers"]
filterwarnings = [
    # Raised inside coreai-opt by its own use of pydantic.
    "ignore:Accessing the 'model_fields' attribute on the instance is deprecated",
]
