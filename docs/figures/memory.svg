<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 629" width="980" height="629" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
<title id="title">Peak memory footprint against the per-process limit</title>
<desc id="desc">Dot plot of peak phys_footprint per scenario between 4.8 and 6.6 GB, with the 6.0 GB steady-state target and the 6.44 GB per-process limit. The shipped engine peaks at 5.65 to 5.73 GB. Before output preallocation, first decodes after a long prompt or a KV restore reached 6.20 and 6.30 GB. A four-capacity package at 32,000 and an all-INT8 package were terminated.</desc>
<style>
.bg{fill:#fcfcfb}
.t1{fill:#0b0b0b;font-size:16px;font-weight:600}
.t2{fill:#0b0b0b;font-size:13px}
.t2b{fill:#0b0b0b;font-size:13px;font-weight:600}
.t3{fill:#52514e;font-size:12px}
.t4{fill:#898781;font-size:11px}
.num{font-variant-numeric:tabular-nums}
.grid{stroke:#e1e0d9;stroke-width:1}
.axis{stroke:#c3c2b7;stroke-width:1}
.line{stroke:#52514e;stroke-width:1.5;fill:none}
.ane{fill:#2a78d6}.aneS{stroke:#2a78d6}.aneT{fill:#e6effa}
.gpu{fill:#eb6834}.gpuS{stroke:#eb6834}.gpuT{fill:#fcece5}
.cpu{fill:#1baf7a}.cpuS{stroke:#1baf7a}.cpuT{fill:#e3f4ed}
.neutral{fill:#b9b8b2}.neutralS{stroke:#898781}
.panel{fill:#f4f3ef}
.surf{fill:#fcfcfb}
.arrow{fill:#52514e}
.hatch{stroke:#2a78d6;stroke-width:1.2}
.bad{fill:#d03b3b}.badS{stroke:#d03b3b}
.halo{paint-order:stroke;stroke:#fcfcfb;stroke-width:4px;stroke-linejoin:round}
.haloT{paint-order:stroke;stroke:#e6effa;stroke-width:5px;stroke-linejoin:round}
.haloA{paint-order:stroke;stroke:#2a78d6;stroke-width:5px;stroke-linejoin:round}
@media (prefers-color-scheme: dark){
.bg{fill:#1a1a19}
.t1,.t2,.t2b{fill:#ffffff}
.t3{fill:#c3c2b7}
.grid{stroke:#2c2c2a}
.axis{stroke:#383835}
.line{stroke:#c3c2b7}
.ane{fill:#3987e5}.aneS{stroke:#3987e5}.aneT{fill:#1c2a3d}
.gpu{fill:#d95926}.gpuS{stroke:#d95926}.gpuT{fill:#3a2418}
.cpu{fill:#199e70}.cpuS{stroke:#199e70}.cpuT{fill:#16302a}
.neutral{fill:#5f5e5a}.neutralS{stroke:#898781}
.panel{fill:#232322}
.surf{fill:#1a1a19}
.arrow{fill:#c3c2b7}
.hatch{stroke:#3987e5}
.halo{stroke:#1a1a19}.haloT{stroke:#1c2a3d}.haloA{stroke:#3987e5}
}
</style>
<defs><marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow" d="M0,0 L8,4 L0,8 z"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hatch" x1="0" y1="0" x2="0" y2="6"/></pattern><pattern id="hatchW" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.2"/></pattern></defs>
<rect class="bg" x="0" y="0" width="980" height="629" rx="10"/>
<text x="24" y="32" class="t1" text-anchor="start">Peak memory footprint against the per-process limit</text><text x="24" y="52" class="t3" text-anchor="start">iPhone 18 Pro, iOS 27.2: peak phys_footprint per scenario</text><line x1="380.0" y1="74" x2="380.0" y2="474" class="grid"/><text x="380.0" y="490" class="t4 num" text-anchor="middle">4.8</text><line x1="437.8" y1="74" x2="437.8" y2="474" class="grid"/><text x="437.7777777777778" y="490" class="t4 num" text-anchor="middle">5.0</text><line x1="495.6" y1="74" x2="495.6" y2="474" class="grid"/><text x="495.55555555555566" y="490" class="t4 num" text-anchor="middle">5.2</text><line x1="553.3" y1="74" x2="553.3" y2="474" class="grid"/><text x="553.3333333333335" y="490" class="t4 num" text-anchor="middle">5.4</text><line x1="611.1" y1="74" x2="611.1" y2="474" class="grid"/><text x="611.1111111111111" y="490" class="t4 num" text-anchor="middle">5.6</text><line x1="668.9" y1="74" x2="668.9" y2="474" class="grid"/><text x="668.8888888888889" y="490" class="t4 num" text-anchor="middle">5.8</text><line x1="726.7" y1="74" x2="726.7" y2="474" class="grid"/><text x="726.6666666666667" y="490" class="t4 num" text-anchor="middle">6.0</text><line x1="784.4" y1="74" x2="784.4" y2="474" class="grid"/><text x="784.4444444444446" y="490" class="t4 num" text-anchor="middle">6.2</text><line x1="842.2" y1="74" x2="842.2" y2="474" class="grid"/><text x="842.2222222222224" y="490" class="t4 num" text-anchor="middle">6.4</text><line x1="900.0" y1="74" x2="900.0" y2="474" class="grid"/><text x="900.0" y="490" class="t4 num" text-anchor="middle">6.6</text><text x="900" y="506" class="t4" text-anchor="end">GB</text><line x1="726.7" y1="70" x2="726.7" y2="474" class="neutralS" stroke-width="1.5" stroke-dasharray="4 3"/><text x="722.6666666666667" y="66" class="t4" text-anchor="end">steady-state target 6.0<tspan dy="-5" font-size="9px">1</tspan></text><line x1="854.5" y1="70" x2="854.5" y2="474" class="badS" stroke-width="1.5"/><text x="858.4905614222223" y="66" class="t4" text-anchor="start">limit 6.44<tspan dy="-5" font-size="9px">2</tspan></text><text x="24" y="94" class="t2b" text-anchor="start">Shipped engine</text><text x="40" y="120" class="t3" text-anchor="start">11-minute sustained run, Release</text><circle cx="648.6" cy="116" r="5.5" class="ane"><title>11-minute sustained run, Release: 5.729605576 GB</title></circle><text x="658.5527219555556" y="120" class="t3 num halo" text-anchor="start">5.73</text><text x="40" y="146" class="t3" text-anchor="start">cold start, 512 tokens</text><circle cx="625.1" cy="142" r="5.5" class="ane"><title>cold start, 512 tokens: 5.648453968 GB</title></circle><text x="635.108924088889" y="146" class="t3 num halo" text-anchor="start">5.65</text><text x="40" y="172" class="t3" text-anchor="start">cold start, 13.7K-token prompt</text><circle cx="645.8" cy="168" r="5.5" class="ane"><title>cold start, 13.7K-token prompt: 5.72 GB</title></circle><text x="655.7777777777778" y="172" class="t3 num halo" text-anchor="start">5.72</text><text x="40" y="198" class="t3" text-anchor="start">reload and KV restore</text><circle cx="631.0" cy="194" r="5.5" class="ane"><title>reload and KV restore: 5.669 GB</title></circle><text x="641.0444444444444" y="198" class="t3 num halo" text-anchor="start">5.67</text><text x="24" y="224" class="t2b" text-anchor="start">Same engine, capacity 4,096</text><text x="40" y="250" class="t3" text-anchor="start">cold start, 512 tokens</text><circle cx="445.6" cy="246" r="5.5" class="ane"><title>cold start, 512 tokens: 5.027 GB</title></circle><text x="455.5777777777779" y="250" class="t3 num halo" text-anchor="start">5.03</text><text x="24" y="276" class="t2b" text-anchor="start">Before output preallocation<tspan dy="-5" font-size="9px">3</tspan><tspan dy="5"> (capacity 16,384)</tspan></text><text x="40" y="302" class="t3" text-anchor="start">cold start, 512 tokens</text><circle cx="722.3" cy="298" r="5.5" class="neutral"><title>cold start, 512 tokens: 5.985 GB</title></circle><text x="732.3333333333335" y="302" class="t3 num halo" text-anchor="start">5.99</text><text x="40" y="328" class="t3" text-anchor="start">first decode after a 13.6K-token prompt</text><circle cx="783.0" cy="324" r="5.5" class="neutral"><title>first decode after a 13.6K-token prompt: 6.195 GB</title></circle><text x="773.0000000000002" y="328" class="t3 num halo" text-anchor="end">6.20</text><text x="40" y="354" class="t3" text-anchor="start">first decode after reload and KV restore</text><circle cx="814.2" cy="350" r="5.5" class="neutral"><title>first decode after reload and KV restore: 6.303 GB</title></circle><text x="804.2" y="354" class="t3 num halo" text-anchor="end">6.30</text><text x="24" y="380" class="t2b" text-anchor="start">Rejected packages<tspan dy="-5" font-size="9px">4</tspan></text><text x="40" y="406" class="t3" text-anchor="start">four capacities, at 16,384</text><circle cx="813.3" cy="402" r="5.5" class="neutral"><title>four capacities, at 16,384: 6.3 GB</title></circle><text x="803.3333333333334" y="406" class="t3 num halo" text-anchor="end">6.30</text><text x="40" y="432" class="t3" text-anchor="start">four capacities, at 32,000</text><g class="badS" stroke-width="2.5"><line x1="848.8" y1="423" x2="858.8" y2="433"/><line x1="848.8" y1="433" x2="858.8" y2="423"/></g><text x="843.777777777778" y="432" class="t3 num halo" text-anchor="end">6.44</text><text x="40" y="458" class="t3" text-anchor="start">all INT8, capacity 4,096</text><g class="badS" stroke-width="2.5"><line x1="773.7" y1="449" x2="783.7" y2="459"/><line x1="773.7" y1="459" x2="783.7" y2="449"/></g><text x="768.6666666666667" y="458" class="t3 num halo" text-anchor="end">6.18</text><text x="24" y="532" class="t3" text-anchor="start">1. The memory rule: a steady-state peak of at most 6.0 GB; transients during loading and the first prefill are excluded.</text><text x="24" y="549" class="t3" text-anchor="start">2. 6,442,467,328 bytes (about 6 GiB): footprint plus available memory at the start of the sustained run, with the increased-memory-limit entitlement.</text><text x="24" y="566" class="t3" text-anchor="start">3. Before the outputs of step_1 were bound to arrays allocated once at load.</text><text x="24" y="583" class="t3" text-anchor="start">4. Packages with four KV capacities and an all-INT8 package; a red cross marks a run that the system terminated.</text><text x="24" y="606" class="t3" text-anchor="start">GB = 10<tspan dy="-5" font-size="9px">9</tspan><tspan dy="5"> bytes. Debug builds unless marked Release.</tspan></text>
</svg>
