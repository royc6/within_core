<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 339" width="980" height="339" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
<title id="title">Release 1.1: the four packages under the model-card procedure</title>
<desc id="desc">Four panels of horizontal bars (prefill tokens/s, decode tokens/s, time to the first token, peak memory) for the Full, Balanced, Lite 32K and Lite 4K packages on an iPhone 18 Pro, with Google's published LiteRT-LM GPU figure for the iPhone 17 Pro as a neutral bar. Full (16,384): 1,135, 16.9, 0.9 s, 5.71 GB; Balanced (4,096): 1,705, 22.4, 0.6 s, 5.02 GB; Lite 32K (32,000): 871, 13.5, 1.2 s, 4.91 GB; Lite 4K (4,096): 1,760, 29.2, 0.6 s, 3.25 GB; LiteRT-LM GPU (2,048)^1: 1,189, 25.1, 0.9 s, 3.38 GB.</desc>
<style>
.bg{fill:#fcfcfb}
.t1{fill:#0b0b0b;font-size:16px;font-weight:600}
.t2{fill:#0b0b0b;font-size:13px}
.t2b{fill:#0b0b0b;font-size:13px;font-weight:600}
.t3{fill:#52514e;font-size:12px}
.t4{fill:#898781;font-size:11px}
