.axis{stroke:#c3c2b7;stroke-width:1}
.line{stroke:#52514e;stroke-width:1.5;fill:none}
.ane{fill:#2a78d6}.aneS{stroke:#2a78d6}.aneT{fill:#e6effa}
.gpu{fill:#eb6834}.gpuS{stroke:#eb6834}.gpuT{fill:#fcece5}
.cpu{fill:#1baf7a}.cpuS{stroke:#1baf7a}.cpuT{fill:#e3f4ed}
.neutral{fill:#b9b8b2}.neutralS{stroke:#898781}
.panel{fill:#f4f3ef}
.surf{fill:#fcfcfb}
.arrow{fill:#52514e}
.hatch{stroke:#2a78d6;stroke-width:1.2}
.bad{fill:#d03b3b}.badS{stroke:#d03b3b}
.halo{paint-order:stroke;stroke:#fcfcfb;stroke-width:4px;stroke-linejoin:round}
.haloT{paint-order:stroke;stroke:#e6effa;stroke-width:5px;stroke-linejoin:round}
.haloA{paint-order:stroke;stroke:#2a78d6;stroke-width:5px;stroke-linejoin:round}
@media (prefers-color-scheme: dark){
.bg{fill:#1a1a19}
.t1,.t2,.t2b{fill:#ffffff}
.t3{fill:#c3c2b7}
.grid{stroke:#2c2c2a}
.axis{stroke:#383835}
.line{stroke:#c3c2b7}
.ane{fill:#3987e5}.aneS{stroke:#3987e5}.aneT{fill:#1c2a3d}
.gpu{fill:#d95926}.gpuS{stroke:#d95926}.gpuT{fill:#3a2418}
.cpu{fill:#199e70}.cpuS{stroke:#199e70}.cpuT{fill:#16302a}
.neutral{fill:#5f5e5a}.neutralS{stroke:#898781}
.panel{fill:#232322}
.surf{fill:#1a1a19}
.arrow{fill:#c3c2b7}
.hatch{stroke:#3987e5}
.halo{stroke:#1a1a19}.haloT{stroke:#1c2a3d}.haloA{stroke:#3987e5}
}
</style>
<defs><marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow" d="M0,0 L8,4 L0,8 z"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hatch" x1="0" y1="0" x2="0" y2="6"/></pattern><pattern id="hatchW" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.2"/></pattern></defs>
<rect class="bg" x="0" y="0" width="980" height="339" rx="10"/>
<text x="24" y="32" class="t1" text-anchor="start">Release 1.1: the four packages under the model-card procedure</text><text x="24" y="52" class="t3" text-anchor="start">iPhone 18 Pro, iOS 27.2, Release build; a 1,024-token prompt, 256 generated tokens, medians of five runs</text><text x="262" y="86" class="t2b" text-anchor="start">Prefill</text><line x1="262.0" y1="100" x2="262.0" y2="224" class="grid"/><text x="262.0" y="238" class="t4 num" text-anchor="middle">0</text><line x1="297.0" y1="100" x2="297.0" y2="224" class="grid"/><text x="297.0" y="238" class="t4 num" text-anchor="middle">500</text><line x1="332.0" y1="100" x2="332.0" y2="224" class="grid"/><text x="332.0" y="238" class="t4 num" text-anchor="middle">1,000</text><line x1="367.0" y1="100" x2="367.0" y2="224" class="grid"/><text x="367.0" y="238" class="t4 num" text-anchor="middle">1,500</text><line x1="402.0" y1="100" x2="402.0" y2="224" class="grid"/><text x="402.0" y="238" class="t4 num" text-anchor="middle">2,000</text><text x="402" y="252" class="t4" text-anchor="end">tokens/s</text><rect x="262" y="108" width="79.4" height="15" rx="3" class="ane"><title>Full (16,384): 1,135 tokens/s</title></rect><text x="347.45" y="119" class="t3 num halo" text-anchor="start">1,135</text><rect x="262" y="132" width="119.4" height="15" rx="3" class="ane"><title>Balanced (4,096): 1,705 tokens/s</title></rect><text x="387.35" y="143" class="t3 num halo" text-anchor="start">1,705</text><rect x="262" y="156" width="61.0" height="15" rx="3" class="ane"><title>Lite 32K (32,000): 871 tokens/s</title></rect><text x="328.97" y="167" class="t3 num halo" text-anchor="start">871</text><rect x="262" y="180" width="123.2" height="15" rx="3" class="ane"><title>Lite 4K (4,096): 1,760 tokens/s</title></rect><text x="391.2" y="191" class="t3 num halo" text-anchor="start">1,760</text><rect x="262" y="204" width="83.2" height="15" rx="3" class="neutral"><title>LiteRT-LM GPU (2,048)^1: 1,189 tokens/s</title></rect><text x="351.23" y="215" class="t3 num halo" text-anchor="start">1,189</text><text x="438" y="86" class="t2b" text-anchor="start">Decode</text><line x1="438.0" y1="100" x2="438.0" y2="224" class="grid"/><text x="438.0" y="238" class="t4 num" text-anchor="middle">0</text><line x1="481.8" y1="100" x2="481.8" y2="224" class="grid"/><text x="481.75" y="238" class="t4 num" text-anchor="middle">10</text><line x1="525.5" y1="100" x2="525.5" y2="224" class="grid"/><text x="525.5" y="238" class="t4 num" text-anchor="middle">20</text><line x1="569.2" y1="100" x2="569.2" y2="224" class="grid"/><text x="569.25" y="238" class="t4 num" text-anchor="middle">30</text><text x="578" y="252" class="t4" text-anchor="end">tokens/s</text><rect x="438" y="108" width="73.9" height="15" rx="3" class="ane"><title>Full (16,384): 16.9 tokens/s</title></rect><text x="517.9375" y="119" class="t3 num halo" text-anchor="start">16.9</text><rect x="438" y="132" width="98.0" height="15" rx="3" class="ane"><title>Balanced (4,096): 22.4 tokens/s</title></rect><text x="542.0" y="143" class="t3 num halo" text-anchor="start">22.4</text><rect x="438" y="156" width="59.1" height="15" rx="3" class="ane"><title>Lite 32K (32,000): 13.5 tokens/s</title></rect><text x="503.0625" y="167" class="t3 num halo" text-anchor="start">13.5</text><rect x="438" y="180" width="127.8" height="15" rx="3" class="ane"><title>Lite 4K (4,096): 29.2 tokens/s</title></rect><text x="571.75" y="191" class="t3 num halo" text-anchor="start">29.2</text><rect x="438" y="204" width="109.8" height="15" rx="3" class="neutral"><title>LiteRT-LM GPU (2,048)^1: 25.1 tokens/s</title></rect><text x="553.8125" y="215" class="t3 num halo" text-anchor="start">25.1</text><text x="614" y="86" class="t2b" text-anchor="start">Time to the first token</text><line x1="614.0" y1="100" x2="614.0" y2="224" class="grid"/><text x="614.0" y="238" class="t4 num" text-anchor="middle">0</text><line x1="657.8" y1="100" x2="657.8" y2="224" class="grid"/><text x="657.75" y="238" class="t4 num" text-anchor="middle">0.5</text><line x1="701.5" y1="100" x2="701.5" y2="224" class="grid"/><text x="701.5" y="238" class="t4 num" text-anchor="middle">1</text><line x1="745.2" y1="100" x2="745.2" y2="224" class="grid"/><text x="745.25" y="238" class="t4 num" text-anchor="middle">1.5</text><text x="754" y="252" class="t4" text-anchor="end">s</text><rect x="614" y="108" width="78.8" height="15" rx="3" class="ane"><title>Full (16,384): 0.9 s</title></rect><text x="698.75" y="119" class="t3 num halo" text-anchor="start">0.9</text><rect x="614" y="132" width="52.5" height="15" rx="3" class="ane"><title>Balanced (4,096): 0.6 s</title></rect><text x="672.5" y="143" class="t3 num halo" text-anchor="start">0.6</text><rect x="614" y="156" width="105.0" height="15" rx="3" class="ane"><title>Lite 32K (32,000): 1.2 s</title></rect><text x="725.0" y="167" class="t3 num halo" text-anchor="start">1.2</text><rect x="614" y="180" width="52.5" height="15" rx="3" class="ane"><title>Lite 4K (4,096): 0.6 s</title></rect><text x="672.5" y="191" class="t3 num halo" text-anchor="start">0.6</text><rect x="614" y="204" width="78.8" height="15" rx="3" class="neutral"><title>LiteRT-LM GPU (2,048)^1: 0.9 s</title></rect><text x="698.75" y="215" class="t3 num halo" text-anchor="start">0.9</text><text x="790" y="86" class="t2b" text-anchor="start">Peak memory</text><line x1="790.0" y1="100" x2="790.0" y2="224" class="grid"/><text x="790.0" y="238" class="t4 num" text-anchor="middle">0</text><line x1="833.8" y1="100" x2="833.8" y2="224" class="grid"/><text x="833.75" y="238" class="t4 num" text-anchor="middle">2</text><line x1="877.5" y1="100" x2="877.5" y2="224" class="grid"/><text x="877.5" y="238" class="t4 num" text-anchor="middle">4</text><line x1="921.2" y1="100" x2="921.2" y2="224" class="grid"/><text x="921.25" y="238" class="t4 num" text-anchor="middle">6</text><text x="930" y="252" class="t4" text-anchor="end">GB</text><rect x="790" y="108" width="125.0" height="15" rx="3" class="ane"><title>Full (16,384): 5.71 GB</title></rect><text x="920.95" y="119" class="t3 num halo" text-anchor="start">5.71</text><rect x="790" y="132" width="109.7" height="15" rx="3" class="ane"><title>Balanced (4,096): 5.02 GB</title></rect><text x="905.746875" y="143" class="t3 num halo" text-anchor="start">5.02</text><rect x="790" y="156" width="107.5" height="15" rx="3" class="ane"><title>Lite 32K (32,000): 4.91 GB</title></rect><text x="903.45" y="167" class="t3 num halo" text-anchor="start">4.91</text><rect x="790" y="180" width="71.2" height="15" rx="3" class="ane"><title>Lite 4K (4,096): 3.25 GB</title></rect><text x="867.203125" y="191" class="t3 num halo" text-anchor="start">3.25</text><rect x="790" y="204" width="73.9" height="15" rx="3" class="neutral"><title>LiteRT-LM GPU (2,048)^1: 3.38 GB</title></rect><text x="869.9375" y="215" class="t3 num halo" text-anchor="start">3.38</text><text x="24" y="119" class="t2" text-anchor="start">Full (16,384)</text><text x="24" y="143" class="t2" text-anchor="start">Balanced (4,096)</text><text x="24" y="167" class="t2" text-anchor="start">Lite 32K (32,000)</text><text x="24" y="191" class="t2" text-anchor="start">Lite 4K (4,096)</text><text x="24" y="215" class="t2" text-anchor="start">LiteRT-LM GPU (2,048)<tspan dy="-5" font-size="9px">1</tspan></text><text x="24" y="276" class="t3" text-anchor="start">1. Google's Gemma 4 model card for the iPhone 17 Pro with LiteRT-LM on the GPU: 1,024 prompt tokens, 256 generated, a 2,048-token context, Google's own quantization</text><text x="38" y="293" class="t3" text-anchor="start">and a 3.66 GB model file. A different phone, capacity and quantization: not a like-for-like comparison and not reproduced here (Section 3.5).</text><text x="24" y="316" class="t3" text-anchor="start">Peak memory is the largest footprint seen in the five runs. Source: results/tiers.json.</text>
</svg>
