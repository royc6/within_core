<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 597" width="980" height="597" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
<title id="title">Prefill width: the lite weights at four widths, and the width chosen for each tier</title>
<desc id="desc">Panel A: the lite weights prefill at 407, 910, 990, 1,003 tokens/s at widths 16, 64, 128, 256; the curve is flat from 128. Panel B, prefill tokens/s per tier and width: Full (16,384) 16 wide 426, 64 wide 1,135 (chosen), 128 wide did not fit in memory; Balanced (4,096) 16 wide 570, 64 wide 1,705 (chosen), 128 wide 1,898; Lite 32K (32,000) 64 wide 788, 128 wide 871 (chosen); Lite 4K (4,096) 128 wide 1,760 (chosen); Google's published LiteRT-LM GPU figure for the iPhone 17 Pro, 1,189 tokens/s, as a neutral bar and a dashed line.</desc>
<style>
.bg{fill:#fcfcfb}
.t1{fill:#0b0b0b;font-size:16px;font-weight:600}
.t2{fill:#0b0b0b;font-size:13px}
.t2b{fill:#0b0b0b;font-size:13px;font-weight:600}
.t3{fill:#52514e;font-size:12px}
.t4{fill:#898781;font-size:11px}
.num{font-variant-numeric:tabular-nums}
.grid{stroke:#e1e0d9;stroke-width:1}
.axis{stroke:#c3c2b7;stroke-width:1}
.line{stroke:#52514e;stroke-width:1.5;fill:none}
.ane{fill:#2a78d6}.aneS{stroke:#2a78d6}.aneT{fill:#e6effa}
.gpu{fill:#eb6834}.gpuS{stroke:#eb6834}.gpuT{fill:#fcece5}
.cpu{fill:#1baf7a}.cpuS{stroke:#1baf7a}.cpuT{fill:#e3f4ed}
.neutral{fill:#b9b8b2}.neutralS{stroke:#898781}
.panel{fill:#f4f3ef}
.surf{fill:#fcfcfb}
.arrow{fill:#52514e}
.hatch{stroke:#2a78d6;stroke-width:1.2}
.bad{fill:#d03b3b}.badS{stroke:#d03b3b}
.halo{paint-order:stroke;stroke:#fcfcfb;stroke-width:4px;stroke-linejoin:round}
.haloT{paint-order:stroke;stroke:#e6effa;stroke-width:5px;stroke-linejoin:round}
.haloA{paint-order:stroke;stroke:#2a78d6;stroke-width:5px;stroke-linejoin:round}
@media (prefers-color-scheme: dark){
.bg{fill:#1a1a19}
.t1,.t2,.t2b{fill:#ffffff}
.t3{fill:#c3c2b7}
.grid{stroke:#2c2c2a}
.axis{stroke:#383835}
.line{stroke:#c3c2b7}
.ane{fill:#3987e5}.aneS{stroke:#3987e5}.aneT{fill:#1c2a3d}
.gpu{fill:#d95926}.gpuS{stroke:#d95926}.gpuT{fill:#3a2418}
.cpu{fill:#199e70}.cpuS{stroke:#199e70}.cpuT{fill:#16302a}
.neutral{fill:#5f5e5a}.neutralS{stroke:#898781}
.panel{fill:#232322}
.surf{fill:#1a1a19}
.arrow{fill:#c3c2b7}
.hatch{stroke:#3987e5}
.halo{stroke:#1a1a19}.haloT{stroke:#1c2a3d}.haloA{stroke:#3987e5}
}
</style>
<defs><marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow" d="M0,0 L8,4 L0,8 z"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hatch" x1="0" y1="0" x2="0" y2="6"/></pattern><pattern id="hatchW" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.2"/></pattern></defs>
<rect class="bg" x="0" y="0" width="980" height="597" rx="10"/>
<text x="24" y="32" class="t1" text-anchor="start">Prefill width: the lite weights at four widths, and the width chosen for each tier</text><text x="24" y="52" class="t3" text-anchor="start">Model-card procedure, 1,024-token prompt; a wider function prefills more tokens per Neural Engine call</text><text x="24" y="84" class="t2b" text-anchor="start">A. Lite weights (4,096), widths 16 to 256<tspan dy="-5" font-size="9px">1</tspan></text><line x1="62" y1="318.0" x2="408" y2="318.0" class="grid"/><text x="58" y="322.0" class="t4 num" text-anchor="end">0</text><line x1="62" y1="251.3" x2="408" y2="251.3" class="grid"/><text x="58" y="255.33333333333334" class="t4 num" text-anchor="end">400</text><line x1="62" y1="184.7" x2="408" y2="184.7" class="grid"/><text x="58" y="188.66666666666669" class="t4 num" text-anchor="end">800</text><line x1="62" y1="118.0" x2="408" y2="118.0" class="grid"/><text x="58" y="122.0" class="t4 num" text-anchor="end">1,200</text><text x="58" y="108" class="t4" text-anchor="end">tokens/s</text><polyline points="70.0,250.2 180.0,166.3 290.0,153.0 400.0,150.8" class="line"/><circle cx="70.0" cy="250.2" r="5" class="ane"><title>width 16: 407 tokens/s, first token 2.5 s</title></circle><text x="70.0" y="238.16666666666669" class="t3 num halo" text-anchor="middle">407</text><text x="70.0" y="336" class="t4 num" text-anchor="middle">16</text><text x="70.0" y="352" class="t4 num" text-anchor="middle">2.5 s</text><circle cx="180.0" cy="166.3" r="5" class="ane"><title>width 64: 910 tokens/s, first token 1.13 s</title></circle><text x="180.0" y="154.33333333333334" class="t3 num halo" text-anchor="middle">910</text><text x="180.0" y="336" class="t4 num" text-anchor="middle">64</text><text x="180.0" y="352" class="t4 num" text-anchor="middle">1.13 s</text><circle cx="290.0" cy="153.0" r="5" class="ane"><title>width 128: 990 tokens/s, first token 1.04 s</title></circle><text x="290.0" y="141.0" class="t3 num halo" text-anchor="middle">990</text><text x="290.0" y="336" class="t4 num" text-anchor="middle">128</text><text x="290.0" y="352" class="t4 num" text-anchor="middle">1.04 s</text><circle cx="400.0" cy="150.8" r="5" class="ane"><title>width 256: 1,003 tokens/s, first token 1.03 s</title></circle><text x="400.0" y="138.83333333333334" class="t3 num halo" text-anchor="middle">1,003</text><text x="400.0" y="336" class="t4 num" text-anchor="middle">256</text><text x="400.0" y="352" class="t4 num" text-anchor="middle">1.03 s</text><text x="235.0" y="370" class="t4" text-anchor="middle">width; time to the first token</text><text x="470" y="84" class="t2b" text-anchor="start">B. The widths tried per tier; the chosen one filled</text><line x1="585.0" y1="114" x2="585.0" y2="410" class="grid"/><text x="585.0" y="424" class="t4 num" text-anchor="middle">0</text><line x1="636.2" y1="114" x2="636.2" y2="410" class="grid"/><text x="636.25" y="424" class="t4 num" text-anchor="middle">500</text><line x1="687.5" y1="114" x2="687.5" y2="410" class="grid"/><text x="687.5" y="424" class="t4 num" text-anchor="middle">1,000</text><line x1="738.8" y1="114" x2="738.8" y2="410" class="grid"/><text x="738.75" y="424" class="t4 num" text-anchor="middle">1,500</text><line x1="790.0" y1="114" x2="790.0" y2="410" class="grid"/><text x="790.0" y="424" class="t4 num" text-anchor="middle">2,000</text><line x1="706.9" y1="114" x2="706.9" y2="410" class="neutralS" stroke-width="1.5" stroke-dasharray="4 3"/><text x="790" y="438" class="t4" text-anchor="end">tokens/s</text><text x="845" y="110" class="t4" text-anchor="end">prefill</text><text x="905" y="110" class="t4" text-anchor="end">first token</text><text x="965" y="110" class="t4" text-anchor="end">peak</text><text x="470" y="130" class="t2" text-anchor="start">Full (16,384)</text><text x="573" y="147" class="t4 num" text-anchor="end">16 wide</text><rect x="585" y="136" width="43.7" height="14" rx="3" fill="none" class="aneS" stroke-width="1.5"><title>Full (16,384), 16 wide: 426 tokens/s, first token 2.4 s, 5.75 GB</title></rect><text x="845" y="147" class="t4 num" text-anchor="end">426</text><text x="905" y="147" class="t4 num" text-anchor="end">2.4 s</text><text x="965" y="147" class="t4 num" text-anchor="end">5.75 GB</text><text x="573" y="164" class="t4 num" text-anchor="end">64 wide</text><rect x="585" y="153" width="116.3" height="14" rx="3" class="ane"><title>Full (16,384), 64 wide: 1,135 tokens/s, first token 0.9 s, 5.71 GB</title></rect><text x="845" y="164" class="t3 num" text-anchor="end">1,135</text><text x="905" y="164" class="t3 num" text-anchor="end">0.9 s</text><text x="965" y="164" class="t3 num" text-anchor="end">5.71 GB</text><text x="573" y="181" class="t4 num" text-anchor="end">128 wide</text><g class="badS" stroke-width="2"><line x1="587" y1="172" x2="597" y2="182"/><line x1="587" y1="182" x2="597" y2="172"/></g><text x="605" y="181" class="t4 halo" text-anchor="start">did not fit in memory<tspan dy="-5" font-size="9px">2</tspan></text><text x="470" y="207" class="t2" text-anchor="start">Balanced (4,096)</text><text x="573" y="224" class="t4 num" text-anchor="end">16 wide</text><rect x="585" y="213" width="58.4" height="14" rx="3" fill="none" class="aneS" stroke-width="1.5"><title>Balanced (4,096), 16 wide: 570 tokens/s, first token 1.8 s, 5.13 GB</title></rect><text x="845" y="224" class="t4 num" text-anchor="end">570</text><text x="905" y="224" class="t4 num" text-anchor="end">1.8 s</text><text x="965" y="224" class="t4 num" text-anchor="end">5.13 GB</text><text x="573" y="241" class="t4 num" text-anchor="end">64 wide</text><rect x="585" y="230" width="174.8" height="14" rx="3" class="ane"><title>Balanced (4,096), 64 wide: 1,705 tokens/s, first token 0.6 s, 5.02 GB</title></rect><text x="845" y="241" class="t3 num" text-anchor="end">1,705</text><text x="905" y="241" class="t3 num" text-anchor="end">0.6 s</text><text x="965" y="241" class="t3 num" text-anchor="end">5.02 GB</text><text x="573" y="258" class="t4 num" text-anchor="end">128 wide</text><rect x="585" y="247" width="194.5" height="14" rx="3" fill="none" class="aneS" stroke-width="1.5"><title>Balanced (4,096), 128 wide: 1,898 tokens/s, first token 0.55 s, 5.87 GB</title></rect><text x="845" y="258" class="t4 num" text-anchor="end">1,898</text><text x="905" y="258" class="t4 num" text-anchor="end">0.55 s</text><text x="965" y="258" class="t4 num" text-anchor="end">5.87 GB</text><text x="470" y="284" class="t2" text-anchor="start">Lite 32K (32,000)</text><text x="573" y="301" class="t4 num" text-anchor="end">64 wide</text><rect x="585" y="290" width="80.8" height="14" rx="3" fill="none" class="aneS" stroke-width="1.5"><title>Lite 32K (32,000), 64 wide: 788 tokens/s, first token 1.31 s, 4.48 GB</title></rect><text x="845" y="301" class="t4 num" text-anchor="end">788</text><text x="905" y="301" class="t4 num" text-anchor="end">1.31 s</text><text x="965" y="301" class="t4 num" text-anchor="end">4.48 GB</text><text x="573" y="318" class="t4 num" text-anchor="end">128 wide</text><rect x="585" y="307" width="89.3" height="14" rx="3" class="ane"><title>Lite 32K (32,000), 128 wide: 871 tokens/s, first token 1.19 s, 4.91 GB</title></rect><text x="845" y="318" class="t3 num" text-anchor="end">871</text><text x="905" y="318" class="t3 num" text-anchor="end">1.19 s</text><text x="965" y="318" class="t3 num" text-anchor="end">4.91 GB</text><text x="470" y="344" class="t2" text-anchor="start">Lite 4K (4,096)</text><text x="573" y="361" class="t4 num" text-anchor="end">128 wide</text><rect x="585" y="350" width="180.4" height="14" rx="3" class="ane"><title>Lite 4K (4,096), 128 wide: 1,760 tokens/s, first token 0.59 s, 3.25 GB</title></rect><text x="845" y="361" class="t3 num" text-anchor="end">1,760</text><text x="905" y="361" class="t3 num" text-anchor="end">0.59 s</text><text x="965" y="361" class="t3 num" text-anchor="end">3.25 GB</text><text x="470" y="387" class="t3" text-anchor="start">LiteRT-LM GPU (2,048)<tspan dy="-5" font-size="9px">3</tspan></text><rect x="585" y="393" width="121.9" height="14" rx="3" class="neutral"><title>LiteRT-LM GPU (2,048): 1,189 tokens/s, first token 0.9 s, 3.38 GB</title></rect><text x="845" y="404" class="t4 num" text-anchor="end">1,189</text><text x="905" y="404" class="t4 num" text-anchor="end">0.9 s</text><text x="965" y="404" class="t4 num" text-anchor="end">3.38 GB</text><text x="24" y="466" class="t3" text-anchor="start">1. Measured before the host's input arrays were copied in one run (Section 7.2): the host's share was the same at every width, so the curve's shape stands and its</text><text x="38" y="483" class="t3" text-anchor="start">levels are low; the same 128-wide lite package prefills at 1,760 tokens/s in panel B.</text><text x="24" y="500" class="t3" text-anchor="start">2. The first prefill call reached a 6.27 GB footprint with 176 MB of memory available and the engine cancelled the generation.</text><text x="24" y="517" class="t3" text-anchor="start">3. Google's Gemma 4 model card for the iPhone 17 Pro with LiteRT-LM on the GPU: 1,024 prompt tokens, 256 generated, a 2,048-token context, Google's own quantization</text><text x="38" y="534" class="t3" text-anchor="start">and a 3.66 GB model file. A different phone, capacity and quantization: not a like-for-like comparison and not reproduced here (Section 3.5). The dashed line is</text><text x="38" y="551" class="t3" text-anchor="start">its prefill rate.</text><text x="24" y="574" class="t3" text-anchor="start">Panel B: prefill tokens/s, time to the first token, peak memory of the five runs. Source: results/prefill.json (widthCurve, widthByTier), results/tiers.json.</text>
</svg>
