<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 551" width="980" height="551" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
<title id="title">Where one call's time goes</title>
<desc id="desc">Stacked horizontal bars of one call's time: host input preparation, Neural Engine, K/V copy, dispatch and readback. A 128-token lite prefill call went from 124 to 67 ms at 4,096 and from 286 to 136 ms at 32,000 once the inputs were copied in one run; Full's and Balanced's 16-wide calls from 52 and 38 to 36 and 27 ms, and their 64-wide calls take 52 and 34 ms; a decode step is almost all Neural Engine time.</desc>
<style>
.bg{fill:#fcfcfb}
.t1{fill:#0b0b0b;font-size:16px;font-weight:600}
.t2{fill:#0b0b0b;font-size:13px}
.t2b{fill:#0b0b0b;font-size:13px;font-weight:600}
.t3{fill:#52514e;font-size:12px}
.t4{fill:#898781;font-size:11px}
.num{font-variant-numeric:tabular-nums}
.grid{stroke:#e1e0d9;stroke-width:1}
.axis{stroke:#c3c2b7;stroke-width:1}
.line{stroke:#52514e;stroke-width:1.5;fill:none}
.ane{fill:#2a78d6}.aneS{stroke:#2a78d6}.aneT{fill:#e6effa}
.gpu{fill:#eb6834}.gpuS{stroke:#eb6834}.gpuT{fill:#fcece5}
.cpu{fill:#1baf7a}.cpuS{stroke:#1baf7a}.cpuT{fill:#e3f4ed}
.neutral{fill:#b9b8b2}.neutralS{stroke:#898781}
.panel{fill:#f4f3ef}
.surf{fill:#fcfcfb}
.arrow{fill:#52514e}
.hatch{stroke:#2a78d6;stroke-width:1.2}
.bad{fill:#d03b3b}.badS{stroke:#d03b3b}
.halo{paint-order:stroke;stroke:#fcfcfb;stroke-width:4px;stroke-linejoin:round}
.haloT{paint-order:stroke;stroke:#e6effa;stroke-width:5px;stroke-linejoin:round}
.haloA{paint-order:stroke;stroke:#2a78d6;stroke-width:5px;stroke-linejoin:round}
@media (prefers-color-scheme: dark){
.bg{fill:#1a1a19}
.t1,.t2,.t2b{fill:#ffffff}
.t3{fill:#c3c2b7}
.grid{stroke:#2c2c2a}
.axis{stroke:#383835}
.line{stroke:#c3c2b7}
.ane{fill:#3987e5}.aneS{stroke:#3987e5}.aneT{fill:#1c2a3d}
.gpu{fill:#d95926}.gpuS{stroke:#d95926}.gpuT{fill:#3a2418}
.cpu{fill:#199e70}.cpuS{stroke:#199e70}.cpuT{fill:#16302a}
.neutral{fill:#5f5e5a}.neutralS{stroke:#898781}
.panel{fill:#232322}
.surf{fill:#1a1a19}
.arrow{fill:#c3c2b7}
.hatch{stroke:#3987e5}
.halo{stroke:#1a1a19}.haloT{stroke:#1c2a3d}.haloA{stroke:#3987e5}
}
</style>
<defs><marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow" d="M0,0 L8,4 L0,8 z"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hatch" x1="0" y1="0" x2="0" y2="6"/></pattern><pattern id="hatchW" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.2"/></pattern></defs>
<rect class="bg" x="0" y="0" width="980" height="551" rx="10"/>
<text x="24" y="32" class="t1" text-anchor="start">Where one call's time goes</text><text x="24" y="52" class="t3" text-anchor="start">Medians over the model-card runs: the host's input preparation, the Neural Engine's chunk predictions, the K/V copy, dispatch and readback</text><line x1="300.0" y1="90" x2="300.0" y2="408" class="grid"/><text x="300.0" y="424" class="t4 num" text-anchor="middle">0</text><line x1="356.7" y1="90" x2="356.7" y2="408" class="grid"/><text x="356.6666666666667" y="424" class="t4 num" text-anchor="middle">50</text><line x1="413.3" y1="90" x2="413.3" y2="408" class="grid"/><text x="413.3333333333333" y="424" class="t4 num" text-anchor="middle">100</text><line x1="470.0" y1="90" x2="470.0" y2="408" class="grid"/><text x="470.0" y="424" class="t4 num" text-anchor="middle">150</text><line x1="526.7" y1="90" x2="526.7" y2="408" class="grid"/><text x="526.6666666666666" y="424" class="t4 num" text-anchor="middle">200</text><line x1="583.3" y1="90" x2="583.3" y2="408" class="grid"/><text x="583.3333333333334" y="424" class="t4 num" text-anchor="middle">250</text><line x1="640.0" y1="90" x2="640.0" y2="408" class="grid"/><text x="640.0" y="424" class="t4 num" text-anchor="middle">300</text><text x="640" y="440" class="t4" text-anchor="end">ms per call</text><text x="24" y="111" class="t3" text-anchor="start">Lite 4K, prefill_128, before<tspan dy="-5" font-size="9px">1</tspan></text><rect x="300.0" y="101" width="38.5" height="16" class="cpu"><title>Lite 4K, prefill_128, before^1: host input 34.0 ms</title></rect><rect x="338.5" y="101" width="70.7" height="16" class="ane"><title>Lite 4K, prefill_128, before^1: Neural Engine 62.4 ms</title></rect><rect x="409.3" y="101" width="7.1" height="16" class="neutral"><title>Lite 4K, prefill_128, before^1: K/V copy 6.2 ms</title></rect><rect x="416.3" y="101" width="24.4" height="16" class="gpu"><title>Lite 4K, prefill_128, before^1: dispatch and readback 21.6 ms</title></rect><text x="446.794" y="111" class="t3 num halo" text-anchor="start">124 ms</text><text x="24" y="137" class="t2" text-anchor="start">Lite 4K, prefill_128</text><rect x="300.0" y="127" width="0.8" height="16" class="cpu"><title>Lite 4K, prefill_128: host input 0.7 ms</title></rect><rect x="300.8" y="127" width="67.7" height="16" class="ane"><title>Lite 4K, prefill_128: Neural Engine 59.8 ms</title></rect><rect x="368.5" y="127" width="7.1" height="16" class="neutral"><title>Lite 4K, prefill_128: K/V copy 6.3 ms</title></rect><rect x="375.6" y="127" width="0.6" height="16" class="gpu"><title>Lite 4K, prefill_128: dispatch and readback 0.5 ms</title></rect><text x="382.19399999999996" y="137" class="t3 num halo" text-anchor="start">67 ms, 2,142 tokens/s in the call</text><text x="24" y="163" class="t3" text-anchor="start">Lite 32K, prefill_128, before<tspan dy="-5" font-size="9px">1</tspan></text><rect x="300.0" y="153" width="146.1" height="16" class="cpu"><title>Lite 32K, prefill_128, before^1: host input 128.9 ms</title></rect><rect x="446.1" y="153" width="147.1" height="16" class="ane"><title>Lite 32K, prefill_128, before^1: Neural Engine 129.8 ms</title></rect><rect x="593.2" y="153" width="7.3" height="16" class="neutral"><title>Lite 32K, prefill_128, before^1: K/V copy 6.4 ms</title></rect><rect x="600.5" y="153" width="23.3" height="16" class="gpu"><title>Lite 32K, prefill_128, before^1: dispatch and readback 20.6 ms</title></rect><text x="629.7933333333333" y="163" class="t3 num halo" text-anchor="start">286 ms</text><text x="24" y="189" class="t2" text-anchor="start">Lite 32K, prefill_128</text><rect x="300.0" y="179" width="3.0" height="16" class="cpu"><title>Lite 32K, prefill_128: host input 2.7 ms</title></rect><rect x="303.0" y="179" width="141.9" height="16" class="ane"><title>Lite 32K, prefill_128: Neural Engine 125.2 ms</title></rect><rect x="444.9" y="179" width="8.1" height="16" class="neutral"><title>Lite 32K, prefill_128: K/V copy 7.2 ms</title></rect><rect x="453.0" y="179" width="0.8" height="16" class="gpu"><title>Lite 32K, prefill_128: dispatch and readback 0.7 ms</title></rect><text x="459.8613333333333" y="189" class="t3 num halo" text-anchor="start">136 ms, 1,022 tokens/s in the call</text><text x="24" y="215" class="t3" text-anchor="start">Full, prefill_16, before<tspan dy="-5" font-size="9px">1</tspan></text><rect x="300.0" y="205" width="10.6" height="16" class="cpu"><title>Full, prefill_16, before^1: host input 9.4 ms</title></rect><rect x="310.6" y="205" width="44.6" height="16" class="ane"><title>Full, prefill_16, before^1: Neural Engine 39.3 ms</title></rect><rect x="355.2" y="205" width="0.9" height="16" class="neutral"><title>Full, prefill_16, before^1: K/V copy 0.8 ms</title></rect><rect x="356.1" y="205" width="3.2" height="16" class="gpu"><title>Full, prefill_16, before^1: dispatch and readback 2.9 ms</title></rect><text x="365.33" y="215" class="t3 num halo" text-anchor="start">52 ms</text><text x="24" y="241" class="t2" text-anchor="start">Full, prefill_16</text><rect x="300.0" y="231" width="0.3" height="16" class="cpu"><title>Full, prefill_16: host input 0.2 ms</title></rect><rect x="300.3" y="231" width="39.8" height="16" class="ane"><title>Full, prefill_16: Neural Engine 35.1 ms</title></rect><rect x="340.1" y="231" width="0.9" height="16" class="neutral"><title>Full, prefill_16: K/V copy 0.8 ms</title></rect><rect x="341.0" y="231" width="0.2" height="16" class="gpu"><title>Full, prefill_16: dispatch and readback 0.2 ms</title></rect><text x="347.1853333333333" y="241" class="t3 num halo" text-anchor="start">36 ms, 456 tokens/s in the call</text><text x="24" y="267" class="t2" text-anchor="start">Full, prefill_64 (Release 1.1)</text><rect x="300.0" y="257" width="0.9" height="16" class="cpu"><title>Full, prefill_64 (Release 1.1): host input 0.8 ms</title></rect><rect x="300.9" y="257" width="53.8" height="16" class="ane"><title>Full, prefill_64 (Release 1.1): Neural Engine 47.4 ms</title></rect><rect x="354.7" y="257" width="3.5" height="16" class="neutral"><title>Full, prefill_64 (Release 1.1): K/V copy 3.1 ms</title></rect><rect x="358.2" y="257" width="0.4" height="16" class="gpu"><title>Full, prefill_64 (Release 1.1): dispatch and readback 0.4 ms</title></rect><text x="364.6726666666666" y="267" class="t3 num halo" text-anchor="start">52 ms, 1,349 tokens/s in the call</text><text x="24" y="293" class="t3" text-anchor="start">Balanced, prefill_16, before<tspan dy="-5" font-size="9px">1</tspan></text><rect x="300.0" y="283" width="4.7" height="16" class="cpu"><title>Balanced, prefill_16, before^1: host input 4.1 ms</title></rect><rect x="304.7" y="283" width="34.5" height="16" class="ane"><title>Balanced, prefill_16, before^1: Neural Engine 30.4 ms</title></rect><rect x="339.2" y="283" width="0.9" height="16" class="neutral"><title>Balanced, prefill_16, before^1: K/V copy 0.8 ms</title></rect><rect x="340.1" y="283" width="3.2" height="16" class="gpu"><title>Balanced, prefill_16, before^1: dispatch and readback 2.8 ms</title></rect><text x="349.2706666666667" y="293" class="t3 num halo" text-anchor="start">38 ms</text><text x="24" y="319" class="t2" text-anchor="start">Balanced, prefill_16</text><rect x="300.0" y="309" width="0.2" height="16" class="cpu"><title>Balanced, prefill_16: host input 0.2 ms</title></rect><rect x="300.2" y="309" width="29.2" height="16" class="ane"><title>Balanced, prefill_16: Neural Engine 25.8 ms</title></rect><rect x="329.4" y="309" width="0.9" height="16" class="neutral"><title>Balanced, prefill_16: K/V copy 0.8 ms</title></rect><rect x="330.3" y="309" width="0.2" height="16" class="gpu"><title>Balanced, prefill_16: dispatch and readback 0.2 ms</title></rect><text x="336.5093333333333" y="319" class="t3 num halo" text-anchor="start">27 ms, 621 tokens/s in the call</text><text x="24" y="345" class="t2" text-anchor="start">Balanced, prefill_64 (Release 1.1)</text><rect x="300.0" y="335" width="0.4" height="16" class="cpu"><title>Balanced, prefill_64 (Release 1.1): host input 0.4 ms</title></rect><rect x="300.4" y="335" width="34.8" height="16" class="ane"><title>Balanced, prefill_64 (Release 1.1): Neural Engine 30.7 ms</title></rect><rect x="335.2" y="335" width="3.5" height="16" class="neutral"><title>Balanced, prefill_64 (Release 1.1): K/V copy 3.1 ms</title></rect><rect x="338.7" y="335" width="0.3" height="16" class="gpu"><title>Balanced, prefill_64 (Release 1.1): dispatch and readback 0.2 ms</title></rect><text x="344.9753333333333" y="345" class="t3 num halo" text-anchor="start">34 ms, 2,084 tokens/s in the call</text><text x="24" y="371" class="t2" text-anchor="start">Lite 4K, step_1 (decode)</text><rect x="300.0" y="361" width="0.1" height="16" class="cpu"><title>Lite 4K, step_1 (decode): host input 0.1 ms</title></rect><rect x="300.1" y="361" width="36.7" height="16" class="ane"><title>Lite 4K, step_1 (decode): Neural Engine 32.4 ms</title></rect><rect x="336.8" y="361" width="0.2" height="16" class="neutral"><title>Lite 4K, step_1 (decode): K/V copy 0.2 ms</title></rect><rect x="337.0" y="361" width="1.3" height="16" class="gpu"><title>Lite 4K, step_1 (decode): dispatch and readback 1.2 ms</title></rect><text x="344.35200000000003" y="371" class="t3 num halo" text-anchor="start">34 ms, 29.6 tokens/s</text><text x="24" y="397" class="t2" text-anchor="start">Full, step_1 (decode)</text><rect x="300.0" y="387" width="0.2" height="16" class="cpu"><title>Full, step_1 (decode): host input 0.1 ms</title></rect><rect x="300.2" y="387" width="64.6" height="16" class="ane"><title>Full, step_1 (decode): Neural Engine 57.0 ms</title></rect><rect x="364.8" y="387" width="0.2" height="16" class="neutral"><title>Full, step_1 (decode): K/V copy 0.2 ms</title></rect><rect x="365.0" y="387" width="1.3" height="16" class="gpu"><title>Full, step_1 (decode): dispatch and readback 1.1 ms</title></rect><text x="372.2773333333333" y="397" class="t3 num halo" text-anchor="start">58 ms, 17.1 tokens/s</text><rect x="24" y="452" width="12" height="12" rx="2" class="cpu"/><text x="42" y="462" class="t3" text-anchor="start">host input</text><rect x="138" y="452" width="12" height="12" rx="2" class="ane"/><text x="156" y="462" class="t3" text-anchor="start">Neural Engine</text><rect x="276" y="452" width="12" height="12" rx="2" class="neutral"/><text x="294" y="462" class="t3" text-anchor="start">K/V copy</text><rect x="374" y="452" width="12" height="12" rx="2" class="gpu"/><text x="392" y="462" class="t3" text-anchor="start">dispatch and readback</text><text x="24" y="488" class="t3" text-anchor="start">1. Before the engine copied each input array in one run: NDArray(scalars:) walked one value at a time, about 20 ns each, so the input preparation of a 128-token</text><text x="38" y="505" class="t3" text-anchor="start">call took 34 ms of 124 at 4,096 and 129 ms of 286 at 32,000, with about 22 ms of dispatch (callSplitBefore).</text><text x="24" y="528" class="t3" text-anchor="start">The first tenth of the calls, the warm-ups, left out. Source: results/prefill.json (callSplit, callSplitWidth16, callSplitBefore).</text>
</svg>
