xt-anchor="start">—</text><text x="690" y="392" class="t3" text-anchor="start">step_1</text><text x="950" y="392" class="t3 num" text-anchor="end">336.1 MB</text><rect x="24" y="426" width="22" height="16" rx="3" class="aneT"/><rect x="24" y="426" width="22" height="16" rx="3" fill="none" class="aneS"/><text x="54" y="439" class="t3" text-anchor="start">sliding attention (window 512)</text><rect x="290" y="426" width="22" height="16" rx="3" class="ane"/><text x="320" y="439" class="t3" text-anchor="start">full attention</text><rect x="500" y="426" width="22" height="16" rx="3" class="aneT"/><rect x="500" y="426" width="22" height="16" rx="3" fill="url(#hatch)"/><rect x="500" y="426" width="22" height="16" rx="3" fill="none" class="aneS"/><text x="530" y="439" class="t3" text-anchor="start">reuses a donor’s KV</text><rect x="690" y="426" width="22" height="16" rx="3" fill="none" class="aneS" stroke-width="3"/><text x="720" y="439" class="t3" text-anchor="start">donor: 22 (sliding), 23 (full)</text><text x="24" y="478" class="t3" text-anchor="start">1. Six layers per chunk are one period of the attention pattern: five sliding-window layers, then one full-attention layer.</text><text x="24" y="495" class="t3" text-anchor="start">2. prefill_16 runs only in chunks 0–3: prompt tokens need KV but no logits, so layers 24–41 and the head run for the last prompt token only.</text><text x="24" y="518" class="t3" text-anchor="start">MB = 10<tspan dy="-5" font-size="9px">6</tspan><tspan dy="5"> bytes.</tspan></text>
