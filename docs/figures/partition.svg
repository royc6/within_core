.haloA{paint-order:stroke;stroke:#2a78d6;stroke-width:5px;stroke-linejoin:round}
@media (prefers-color-scheme: dark){
.bg{fill:#1a1a19}
.t1,.t2,.t2b{fill:#ffffff}
.t3{fill:#c3c2b7}
.grid{stroke:#2c2c2a}
.axis{stroke:#383835}
.line{stroke:#c3c2b7}
.ane{fill:#3987e5}.aneS{stroke:#3987e5}.aneT{fill:#1c2a3d}
.gpu{fill:#d95926}.gpuS{stroke:#d95926}.gpuT{fill:#3a2418}
.cpu{fill:#199e70}.cpuS{stroke:#199e70}.cpuT{fill:#16302a}
