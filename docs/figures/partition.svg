<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 541" width="980" height="541" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
<title id="title">Partition of the 42 decoder layers</title>
<desc id="desc">Seven rows of six layers and one head row. Layers 5, 11, 17, 23, 29, 35 and 41 use full attention, the rest sliding attention. Chunks 0 to 3 own the KV of their layers and have step_1 and prefill_16 functions; chunks 4 to 6 reuse the KV of donor layers 22 and 23 and have only step_1. The head chunk returns 16 slices of 16,384 logits.</desc>
